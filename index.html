<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />

    <!-- =====================================================
         Basic
    ====================================================== -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>FoundMet | Find Your Co-Founder</title>

    <meta
      name="description"
      content="FoundMet helps founders, builders, and startup-minded people discover co-founders nearby, connect privately, and build together."
    />

    <meta
      name="keywords"
      content="co-founder matching, find co-founder, startup founders, startup India, founder network, co-founder platform, entrepreneurs"
    />

    <meta
      name="author"
      content="FoundMet"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <!-- =====================================================
         Canonical
    ====================================================== -->
    <link
      rel="canonical"
      href="https://foundmet.com/"
    />

    <!-- =====================================================
         Favicon
    ====================================================== -->
    <link
      rel="icon"
      href="/favicon.ico"
      type="image/x-icon"
    />

    <link
      rel="shortcut icon"
      href="/favicon.ico"
      type="image/x-icon"
    />

    <!-- =====================================================
         PWA
    ====================================================== -->
    <link
      rel="manifest"
      href="/manifest.json"
    />

    <meta
      name="theme-color"
      content="#0B5CFF"
    />

    <meta
      name="mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="FoundMet"
    />

    <!-- =====================================================
         Open Graph
    ====================================================== -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="FoundMet"
    />

    <meta
      property="og:title"
      content="FoundMet | Find Your Co-Founder"
    />

    <meta
      property="og:description"
      content="Find co-founders, builders, and startup-minded people nearby and build together."
    />

    <meta
      property="og:url"
      content="https://foundmet.com/"
    />

    <meta
      property="og:image"
      content="https://foundmet.com/og-image.png"
    />

    <meta
      property="og:image:alt"
      content="FoundMet — Find Your Co-Founder"
    />

    <meta
      property="og:locale"
      content="en_IN"
    />

    <!-- =====================================================
         Twitter / X
    ====================================================== -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="FoundMet | Find Your Co-Founder"
    />

    <meta
      name="twitter:description"
      content="Find co-founders, builders, and startup-minded people nearby and build together."
    />

    <meta
      name="twitter:image"
      content="https://foundmet.com/og-image.png"
    />

    <meta
      name="twitter:image:alt"
      content="FoundMet — Find Your Co-Founder"
    />

    <!-- =====================================================
         Google Search Console
    ====================================================== -->
    <meta
      name="google-site-verification"
      content="w4VzJ_KBiyvILH0MMZ1mfMZobGR9cXpcKX6eV5bp41k"
    />

    ====================================================== -->
